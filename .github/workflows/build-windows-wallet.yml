name: Build Windows wallet

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows 10/11 x64
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 curl git zip \
            g++-mingw-w64-x86-64-posix nsis

      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: depends/x86_64-w64-mingw32
          key: depends-win64-${{ hashFiles('depends/**') }}
          restore-keys: depends-win64-

      - name: Fetch chiavdf dependency
        run: |
          if [ ! -f shared-utils/chiavdf/src/verifier.h ]; then
            git clone --depth 1 https://github.com/Chia-Network/chiavdf.git shared-utils/chiavdf
          fi

      - name: Build libargon2 for mingw (v3 admission verification)
        run: |
          set -euo pipefail
          PREFIX="$GITHUB_WORKSPACE/depends/x86_64-w64-mingw32"
          if [ -f "$PREFIX/lib/libargon2.a" ] && [ -f "$PREFIX/include/argon2.h" ]; then
            echo "argon2 already installed in depends prefix, skipping"
            exit 0
          fi
          cd /tmp
          rm -rf argon2-build && mkdir argon2-build && cd argon2-build
          curl -sL -o argon2.tar.gz https://github.com/P-H-C/phc-winner-argon2/archive/refs/tags/20190702.tar.gz
          echo "daf972a89577f8772602bf2eb38b6a3dd3d922bf5724d45e7f9589b5e830442c  argon2.tar.gz" | sha256sum -c -
          tar xzf argon2.tar.gz
          cd phc-winner-argon2-20190702
          # OPTTARGET= (empty): portable ref.c, no -march=native (would tune for
          # the build machine's CPU and break on users' machines).
          # NO_THREADS=1: wallet uses a single Argon2 lane; avoids winpthreads.
          make libargon2.a OPTTARGET= CC="x86_64-w64-mingw32-gcc-posix" \
            CFLAGS="-O2 -DARGON2_NO_THREADS -Iinclude -Isrc"
          x86_64-w64-mingw32-gcc-ranlib libargon2.a
          mkdir -p "$PREFIX/include" "$PREFIX/lib"
          cp include/argon2.h "$PREFIX/include/"
          cp libargon2.a "$PREFIX/lib/"
          echo "argon2 installed to $PREFIX"

      - name: Build GUI installer and CLI wallet
        run: ./scripts/build-windows-x64.sh

      - name: Dump link commands on failure
        if: failure()
        run: |
          echo "=== bitcoin-wallet link.txt ==="
          cat build-windows-x64/src/CMakeFiles/bitcoin-wallet.dir/link.txt || echo "not found"
          echo "=== bitcoin-wallet linkLibs.rsp (one per line) ==="
          tr ' ' "\n" < build-windows-x64/src/CMakeFiles/bitcoin-wallet.dir/linkLibs.rsp | grep -i "ssl\|crypto\|bitcoin_node\|start-group\|end-group" || echo "rsp not found"
          echo "=== bitcoind link.txt ==="
          cat build-windows-x64/src/CMakeFiles/bitcoind.dir/link.txt || echo "not found"
          echo "=== OpenSSL in CMakeCache ==="
          grep -i "openssl.*lib" build-windows-x64/CMakeCache.txt | head -10 || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensorcash-windows-x64-installer
          path: |
            dist/windows-x64/tensorcash-win64-setup.exe
            dist/windows-x64/SHA256SUMS
          if-no-files-found: error

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensorcash-windows-x64-cli
          path: |
            dist/windows-x64/tensorcash-cli-windows-x64.zip
            dist/windows-x64/SHA256SUMS
          if-no-files-found: error

      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-x64/tensorcash-win64-setup.exe
            dist/windows-x64/tensorcash-cli-windows-x64.zip
            dist/windows-x64/SHA256SUMS
