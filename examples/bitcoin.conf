# TensorCash mainnet example configuration
chain=tensor

# Run the JSON-RPC server for local bitcoin-cli access.
server=1

# Participate in the peer-to-peer network.
listen=1

# Keep the full block history. Set prune=<MiB> only if disk space is limited.
prune=0

# Optional SOCKS5 proxy (uncomment when needed).
# proxy=127.0.0.1:9050

# Keep RPC local by default. Do not expose RPC to the public internet.
# rpcbind=127.0.0.1
# rpcallowip=127.0.0.1

# For testnet, replace chain=tensor above with:
# chain=tensor-test
